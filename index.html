<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Agenda DR · Diego Rodríguez</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <script>
    // Aplica preferencias antes de pintar (evita parpadeo)
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('agendaDR.prefs') || '{}');
        var dark = p.theme ? p.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (p.sidebar === 'collapsed') document.documentElement.classList.add('sb-collapsed');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css?v=3.0.0" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-logo"><i class="fas fa-calendar-check"></i></div>
        <div class="brand-text"><strong>Agenda DR</strong><small>Diego Rodríguez</small></div>
      </div>
      <nav class="nav">
        <a href="#/inicio" data-nav="inicio"><i class="fas fa-gauge-high"></i><span>Inicio</span></a>
        <a href="#/agenda" data-nav="agenda"><i class="fas fa-list-check"></i><span>Actividades</span></a>
        <a href="#/calendario" data-nav="calendario"><i class="fas fa-calendar-days"></i><span>Calendario</span></a>
        <a href="#/sistema" data-nav="sistema"><i class="fas fa-server"></i><span>Sistema y respaldo</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost w100" id="btnCollapse" title="Contraer menú"><i class="fas fa-angles-left"></i><span>Contraer</span></button>
        <small class="ver">v3.0.0</small>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btnMenu" aria-label="Menú"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">Inicio</h1>
        <div class="search">
          <i class="fas fa-magnifying-glass"></i>
          <input id="globalSearch" type="search" placeholder="Buscar actividad o lugar…  ( / )" autocomplete="off" />
        </div>
        <button class="db-pill" id="dbPill" title="Estado de la base de datos (clic para despertar)">
          <span class="dot"></span><span class="txt">Conectando…</span>
        </button>
        <button class="icon-btn" id="btnTheme" data-theme-toggle aria-label="Cambiar tema"><i class="fas fa-moon"></i></button>
        <button class="btn primary" id="btnNew" title="Nueva actividad (N)"><i class="fas fa-plus"></i><span class="hide-sm">Nueva</span></button>
      </header>

      <div id="demoBanner" class="demo-banner" hidden>
        <i class="fas fa-flask"></i> MODO DEMO — datos ficticios en memoria. Nada se guarda en la base real.
      </div>

      <main class="content">
        <section data-view="inicio" hidden></section>
        <section data-view="agenda" hidden></section>
        <section data-view="calendario" hidden></section>
        <section data-view="sistema" hidden></section>
      </main>
    </div>
  </div>

  <button class="fab-btn only-mobile" id="fabNew" aria-label="Nueva actividad"><i class="fas fa-plus"></i></button>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=3.0.0"></script>
</body>
</html>
